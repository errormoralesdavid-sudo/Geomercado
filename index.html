<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geo Mercado V19.1</title>
    
    <!-- Configuración PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d1117">
    
    <!-- Estilos -->
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Librerías Externas -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body>

    <!-- Modales para Escáner y Feedback -->
    <div id="modal-camara" class="modal-overlay" style="display:none;">
        <div class="modal-content">
            <div id="interactive-scanner"></div>
            <button class="btn-cancelar" onclick="window.cerrarCamaraEnVivo()">Cerrar Cámara</button>
        </div>
    </div>

    <div id="scan-feedback" class="feedback-overlay" style="display:none;">
        <div id="scan-feedback-box"></div>
        <p id="scan-feedback-msg"></p>
    </div>

    <!-- Lectores ocultos para archivos de imagen -->
    <input type="file" id="file-barcode-reg" accept="image/*" style="display:none;" onchange="window.escanearBarcodeFoto(event, 'registro')">
    <input type="file" id="file-barcode-caja" accept="image/*" style="display:none;" onchange="window.escanearBarcodeFoto(event, 'caja')">
    <div id="hidden-qr-reader" style="display:none;"></div>

    <!-- MÓDULOS JAVASCRIPT EN ORDEN -->
    <script src="js/app.js"></script>
    <script src="js/ui-effects.js"></script>
    <script src="js/scanner.js"></script>
    <script src="js/ocr.js"></script>
    <script src="js/caja.js"></script>
    <script src="js/cierre.js"></script>
</body>
</html>
