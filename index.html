<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Geo Mercado - Sistema Comercial Pro</title>
    <!-- Librerías locales / CDNs con soporte de descarga e impresión -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-card: #1e1e1e;
            --accent: #00e676;
            --text: #ffffff;
            --text-dim: #b0bec5;
        }
        * { box-sizing: border-box; touch-action: manipulation; }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-primary); color: var(--text);
            display: flex; flex-direction: column; min-height: 100vh;
        }
        /* Interfaz táctil optimizada para teléfonos */
        .touch-btn {
            min-height: 48px; min-width: 48px;
            padding: 12px 16px; border-radius: 8px; border: none;
            background: var(--accent); color: #000; font-weight: bold;
            font-size: 16px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center;
        }
        .touch-btn:active { opacity: 0.8; transform: scale(0.98); }
        .grid-layout {
            display: grid; grid-template-columns: 1fr; gap: 12px; padding: 12px;
        }
        /* Responsivo para Tablets y PC */
        @media (min-width: 768px) {
            .grid-layout { grid-template-columns: 2fr 1fr; }
        }
        .card { background: var(--bg-card); padding: 16px; border-radius: 12px; }
    </style>
</head>
<body>

    <div class="grid-layout">
        <section class="card">
            <h2>Venta Rápida</h2>
            <div id="pantalla-cobro">
                <p>Tasa del día: <strong id="tasa-display">0.00</strong> VES/USD</p>
                <button class="touch-btn" onclick="procesarVenta()">Registrar Venta</button>
            </div>
        </section>

        <section class="card">
            <h2>Arqueo y Cierre</h2>
            <button class="touch-btn" style="background:#ff5252; color:#fff;" onclick="generarReportePDF()">Exportar Reporte Z (PDF)</button>
            <div id="reporte-cierre" style="margin-top:15px; padding: 10px; background: #fff; color: #000;">
                <h3 style="margin:0;">Geo Mercado - Cierre de Caja</h3>
                <p>Fecha: <span id="fecha-cierre"></span></p>
                <hr>
                <p>Total USD: <strong id="total-usd">$0.00</strong></p>
                <p>Total VES: <strong id="total-ves">0.00 Bs</strong></p>
            </div>
        </section>
    </div>

    <script>
        // --- 1. PERSISTENCIA CON INDEXEDDB ---
        const DB_NAME = 'GeoMercadoDB';
        const DB_VERSION = 1;
        let db;

        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            if (!db.objectStoreNames.contains('ventas')) {
                db.createObjectStore('ventas', { keyPath: 'id', autoIncrement: true });
            }
            if (!db.objectStoreNames.contains('productos')) {
                db.createObjectStore('productos', { keyPath: 'id' });
            }
        };
        request.onsuccess = (e) => { db = e.target.result; };
        request.onerror = (e) => { console.error('Error abriendo IndexedDB:', e); };

        // --- 2. SEGURIDAD CON HASH (SHA-256) PARA ADMIN PIN ---
        async function verificarPin(pinIngresado, hashGuardado) {
            const encoder = new TextEncoder();
            const data = encoder.encode(pinIngresado);
            const buffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(buffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex === hashGuardado;
        }

        // --- 3. EXPORTACIÓN A PDF (REPORTE Z) ---
        function generarReportePDF() {
            document.getElementById('fecha-cierre').innerText = new Date().toLocaleString();
            const elemento = document.getElementById('reporte-cierre');
            const opciones = {
                margin:       0.5,
                filename:     `Cierre_Caja_${new Date().toISOString().slice(0,10)}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2 },
                jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opciones).from(elemento).save();
        }

        function procesarVenta() {
            if(!db) return;
            const tx = db.transaction('ventas', 'readwrite');
            const store = tx.objectStore('ventas');
            store.add({
                montoUSD: 10.00,
                montoVES: 365.00,
                fecha: new Date().toISOString()
            });
            alert('Venta guardada localmente en IndexedDB');
        }
    </script>
</body>
</html>
