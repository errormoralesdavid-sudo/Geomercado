<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GEO MERCADO 🛍️ - POS Multi-Usuario</title>
  
  <!-- CSS & Tailwind Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Librerías de Escáner y OCR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <!-- Firebase SDKs para sincronización en vivo -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .neon-border { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
  </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

  <!-- ENCABEZADO SUPERIOR -->
  <header class="glass-card px-4 py-3 flex justify-between items-center border-b border-slate-700">
    <div class="flex items-center gap-3">
      <h1 class="text-xl font-bold tracking-wider text-sky-400 flex items-center gap-2">
        <i class="fa-solid font-bold fa-store"></i> GEO MERCADO
      </h1>
      <span id="role-badge" class="text-xs px-2 py-1 rounded-full bg-slate-700 text-slate-300 font-semibold">Cargando rol...</span>
    </div>

    <div class="flex items-center gap-4 text-sm">
      <div class="bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700 flex items-center gap-2">
        <span class="text-slate-400">BCV:</span>
        <span id="tasa-val" class="font-bold text-emerald-400">Bs. 0.00</span>
        <button onclick="obtenerTasaBCV()" class="text-sky-400 hover:text-sky-300 ml-1" title="Actualizar Tasa">
          <i class="fa-solid fa-arrows-rotate"></i>
        </button>
      </div>

      <!-- Selector de Rol (Simulación de Sesión) -->
      <select id="user-role-select" onchange="cambiarRol(this.value)" class="bg-slate-800 text-xs border border-slate-700 rounded-lg px-2 py-1.5 text-slate-200">
        <option value="cajero">Rol: Cajero</option>
        <option value="admin">Rol: Administrador</option>
      </select>
    </div>
  </header>

  <!-- CONTENIDO PRINCIPAL -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- PANEL IZQUIERDO: Ventas y Productos -->
    <main class="flex-1 p-4 flex flex-col gap-4 overflow-y-auto">
      
      <!-- Barra de Búsqueda y Escáner -->
      <div class="glass-card p-3 rounded-xl flex gap-2">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400"></i>
          <input type="text" id="search-input" onkeyup="filtrarProductos()" placeholder="Buscar producto o código..." class="w-full bg-slate-900 border border-slate-700 rounded-lg pl-10 pr-4 py-2 text-sm focus:outline-none focus:border-sky-500">
        </div>
        <button onclick="abrirEscaner()" class="bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded-lg flex items-center gap-2 text-sm font-medium transition">
          <i class="fa-solid fa-barcode"></i> Escanear
        </button>
      </div>

      <!-- Grilla de Productos -->
      <div id="grid-productos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 flex-1 overflow-y-auto pr-1">
        <!-- Productos cargados dinámicamente -->
      </div>
    </main>

    <!-- PANEL DERECHO: Carrito y Cobro -->
    <aside class="w-96 glass-card border-l border-slate-700 flex flex-col">
      <div class="p-4 border-b border-slate-700 flex justify-between items-center">
        <h2 class="font-bold text-lg text-slate-200 flex items-center gap-2">
          <i class="fa-solid fa-cart-shopping text-sky-400"></i> Orden Actual
        </h2>
        <button onclick="vaciarCarrito()" class="text-xs text-rose-400 hover:text-rose-300">Vaciar</button>
      </div>

      <!-- Items del Carrito -->
      <div id="cart-items" class="flex-1 overflow-y-auto p-4 space-y-3">
        <!-- Detalle de la venta -->
      </div>

      <!-- Totales y Resumen -->
      <div class="p-4 border-t border-slate-700 bg-slate-900/50 space-y-3">
        <div class="flex justify-between text-sm text-slate-400">
          <span>Total en USD:</span>
          <span id="total-usd" class="font-bold text-slate-200">$0.00</span>
        </div>
        <div class="flex justify-between text-lg font-bold">
          <span class="text-slate-200">Total en Bs:</span>
          <span id="total-bs" class="text-emerald-400">Bs. 0.00</span>
        </div>

        <!-- Botones de Acción -->
        <button onclick="procesarCobro()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 rounded-xl shadow-lg transition flex justify-center items-center gap-2">
          <i class="fa-solid fa-cash-register"></i> Registrar Venta
        </button>
      </div>
    </aside>

  </div>

  <!-- SCRIPT DE FUNCIONALIDAD -->
  <script>
    // Configuración Inicial de Firebase (Reemplazar con tus credenciales si usas consola propia)
    const firebaseConfig = {
      apiKey: "AIzaSyDemoKeyOnly_GEO_MERCADO",
      authDomain: "geo-mercado-pos.firebaseapp.com",
      databaseURL: "https://geo-mercado-pos-default-rtdb.firebaseio.com",
      projectId: "geo-mercado-pos",
      storageBucket: "geo-mercado-pos.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    // Inicializar Firebase
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Estado Local de la Aplicación
    let tasaBCV = parseFloat(localStorage.getItem('geo_tasa_bcv')) || 623.02;
    let rolActual = localStorage.getItem('geo_rol') || 'admin';
    let productos = [];
    let carrito = [];

    // 1. OBTENER TASA BCV OFICIAL EN TIEMPO REAL
    async function obtenerTasaBCV() {
      try {
        const res = await fetch('https://rates.dolarvzla.com/bcv/current.json');
        const data = await res.json();
        if (data && data.price) {
          tasaBCV = parseFloat(data.price);
          localStorage.setItem('geo_tasa_bcv', tasaBCV);
          document.getElementById('tasa-val').innerText = `Bs. ${tasaBCV.toFixed(2)}`;
          renderizarCarrito();
        }
      } catch (e) {
        console.warn('No se pudo obtener la tasa en vivo, usando respaldo local:', tasaBCV);
        document.getElementById('tasa-val').innerText = `Bs. ${tasaBCV.toFixed(2)}`;
      }
    }

    // 2. CAMBIO Y CONTROL DE ROLES (ADMIN / CAJERO)
    function cambiarRol(nuevoRol) {
      rolActual = nuevoRol;
      localStorage.setItem('geo_rol', nuevoRol);
      const badge = document.getElementById('role-badge');
      badge.innerText = nuevoRol === 'admin' ? 'Administrador Main' : 'Cajero / Terminal';
      badge.className = `text-xs px-2 py-1 rounded-full font-semibold ${nuevoRol === 'admin' ? 'bg-sky-900 text-sky-300 border border-sky-500' : 'bg-slate-700 text-slate-300'}`;
    }

    // 3. SINCRONIZACIÓN DE PRODUCTOS EN TIEMPO REAL
    function sincronizarInventario() {
      // Escucha cambios en tiempo real desde la base de datos principal
      db.ref('inventario').on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
          productos = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        } else {
          // Inventario de prueba inicial si la BD está vacía
          productos = [
            { id: '1', nombre: 'Harina PAN 1kg', precioUSD: 1.10, stock: 45, codigo: '7591001001' },
            { id: '2', nombre: 'Arroz Primor 1kg', precioUSD: 1.25, stock: 30, codigo: '7591002002' },
            { id: '3', nombre: 'Aceite Mazeite 1L', precioUSD: 3.50, stock: 15, codigo: '7591003003' },
            { id: '4', nombre: 'Azúcar Montalbán 1kg', precioUSD: 1.15, stock: 20, codigo: '7591004004' }
          ];
        }
        renderizarProductos(productos);
      });
    }

    // Renderizar Productos en Pantalla
    function renderizarProductos(lista) {
      const grid = document.getElementById('grid-productos');
      grid.innerHTML = '';
      lista.forEach(p => {
        const precioBs = (p.precioUSD * tasaBCV).toFixed(2);
        grid.innerHTML += `
          <div onclick="agregarAlCarrito('${p.id}')" class="glass-card p-3 rounded-xl hover:neon-border transition cursor-pointer flex flex-col justify-between">
            <div>
              <span class="text-xs text-slate-400 font-mono">Cod: ${p.codigo}</span>
              <h3 class="font-bold text-sm text-slate-100 line-clamp-2">${p.nombre}</h3>
            </div>
            <div class="mt-3 flex justify-between items-end">
              <div>
                <p class="text-xs text-slate-400">$${p.precioUSD.toFixed(2)}</p>
                <p class="text-sm font-bold text-emerald-400">Bs. ${precioBs}</p>
              </div>
              <span class="text-xs px-2 py-0.5 rounded bg-slate-800 text-slate-300">Stock: ${p.stock}</span>
            </div>
          </div>
        `;
      });
    }

    // 4. LÓGICA DE CARRITO Y COBRO
    function agregarAlCarrito(id) {
      const prod = productos.find(p => p.id === id);
      if (!prod || prod.stock <= 0) return alert('Producto agotado');

      const itemEnCarrito = carrito.find(item => item.id === id);
      if (itemEnCarrito) {
        if (itemEnCarrito.cant < prod.stock) itemEnCarrito.cant++;
      } else {
        carrito.push({ ...prod, cant: 1 });
      }
      renderizarCarrito();
    }

    function renderizarCarrito() {
      const cartContainer = document.getElementById('cart-items');
      cartContainer.innerHTML = '';
      let totalUSD = 0;

      carrito.forEach((item, index) => {
        const subtotal = item.precioUSD * item.cant;
        totalUSD += subtotal;
        cartContainer.innerHTML += `
          <div class="flex items-center justify-between bg-slate-800/60 p-2.5 rounded-lg border border-slate-700/50">
            <div class="flex-1">
              <h4 class="text-xs font-semibold text-slate-200">${item.nombre}</h4>
              <p class="text-xs text-slate-400">$${item.precioUSD.toFixed(2)} x ${item.cant}</p>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-sm font-bold text-emerald-400">$${subtotal.toFixed(2)}</span>
              <button onclick="eliminarDelCarrito(${index})" class="text-rose-400 hover:text-rose-300 text-xs p-1">
                <i class="fa-solid fa-trash"></i>
              </button>
            </div>
          </div>
        `;
      });

      const totalBs = totalUSD * tasaBCV;
      document.getElementById('total-usd').innerText = `$${totalUSD.toFixed(2)}`;
      document.getElementById('total-bs').innerText = `Bs. ${totalBs.toFixed(2)}`;
    }

    function eliminarDelCarrito(index) {
      carrito.splice(index, 1);
      renderizarCarrito();
    }

    function vaciarCarrito() {
      carrito = [];
      renderizarCarrito();
    }

    // 5. ENVIAR VENTA A LA MEMORIA CENTRAL (FIREBASE)
    function procesarCobro() {
      if (carrito.length === 0) return alert('El carrito está vacío');

      const totalUSD = carrito.reduce((sum, i) => sum + (i.precioUSD * i.cant), 0);
      const totalBs = totalUSD * tasaBCV;

      const venta = {
        fecha: new Date().toISOString(),
        cajeroRol: rolActual,
        items: carrito,
        montoUSD: totalUSD,
        montoBs: totalBs,
        tasaAplicada: tasaBCV
      };

      // Guardar en la base de datos principal centralizada
      db.ref('ventas_registradas').push(venta).then(() => {
        alert('✅ Venta registrada y sincronizada exitosamente con la central');
        vaciarCarrito();
      }).catch(err => {
        console.error('Error al guardar:', err);
        alert('Venta procesada localmente (Modo Offline)');
        vaciarCarrito();
      });
    }

    // Filtrar Productos en la Búsqueda
    function filtrarProductos() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtrados = productos.filter(p => 
        p.nombre.toLowerCase().includes(query) || p.codigo.includes(query)
      );
      renderizarProductos(filtrados);
    }

    // Inicialización al cargar la ventana
    window.onload = () => {
      document.getElementById('user-role-select').value = rolActual;
      cambiarRol(rolActual);
      obtenerTasaBCV();
      sincronizarInventario();
    };
  </script>
</body>
</html>
